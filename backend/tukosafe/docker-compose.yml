services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tukosafe:tukosafe@db:5432/tukosafe
      REDIS_URL: redis://redis:6379/0
      OTP_DEBUG_RETURN: "false"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: tukosafe
      POSTGRES_PASSWORD: tukosafe
      POSTGRES_DB: tukosafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tukosafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
